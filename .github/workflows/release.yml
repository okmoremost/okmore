name: Release APK

# 推送形如 v1.0.1 的 tag 时触发，自动创建 GitHub Release 并上传 apk/ 下的文件
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # 需要写权限来创建 Release 和上传附件

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备稳定命名的发布文件
        # 用固定文件名上传，保证 releases/latest/download/xxx 永远指向最新版
        run: |
          mkdir -p dist
          cp apk/okmore_lite_v*.apk dist/okmore_lite.apk
          cp apk/okmore_full_v*.apk dist/okmore_full.apk
          ls -lh dist

      - name: 创建 Release 并上传 APK 附件
        uses: softprops/action-gh-release@v2
        with:
          # 用 tag 名作为 Release 标题
          name: ${{ github.ref_name }}
          # 自动生成更新说明（基于 tag 间的 commit）
          generate_release_notes: true
          # 上传稳定命名的文件作为附件（latest 链接依赖固定文件名）
          files: |
            dist/okmore_lite.apk
            dist/okmore_full.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
