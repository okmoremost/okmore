<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">网址导航</title>
  <style>
    /* ===== 全局基础样式 ===== */
    :root {
      --bg: #f5f6fa;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --sub: #7f8c9a;
      --accent: #4a90e2;
      --accent-soft: #eaf2fd;
      --border: #e8ebf0;
      --shadow: 0 2px 12px rgba(30, 50, 90, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 0 16px 48px;
      overflow-x: hidden;      /* 兜底：防止任何轻微横向溢出时可滑动 */
    }
    /* ===== 顶部标题 ===== */
    header {
      text-align: center;
      padding: 48px 0 28px;
    }

    /* ===== 站点导航（页面顶部，参考图样式） ===== */
    .site-nav {
      max-width: 860px;
      margin: 22px auto 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 14px 16px 16px;
      text-align: left;
    }
    /* 分类标签行 */
    .site-nav .cat-tabs {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 0 6px;
      border-bottom: 1px solid var(--border);
    }
    /* 分类标签内层：同一行横向滑动，不换行 */
    .site-nav .cat-tabs .cat-list {
      flex: 1 1 auto;
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 20px;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;          /* Firefox 隐藏滚动条 */
    }
    .site-nav .cat-tabs .cat-list::-webkit-scrollbar { display: none; }  /* Chrome/Safari 隐藏滚动条 */
    .site-nav .cat-tab {
      position: relative;
      flex: 0 0 auto;              /* 不收缩，超出时横向滑动 */
      font-size: 15px;
      color: var(--text);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 2px 0 8px;
      font-family: inherit;
      white-space: nowrap;
    }
    .site-nav .cat-tab:hover { color: var(--accent); }
    .site-nav .cat-tab.active {
      color: var(--accent);
      font-weight: 700;
    }
    .site-nav .cat-tab.active::after {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      border-radius: 2px;
      background: var(--accent);
    }
    /* 分类对应的网站行：左侧分类名 + 右侧网站名 */
    .site-nav .cat-panel { padding-top: 6px; }
    .site-nav .site-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border);
    }
    .site-nav .site-row:last-child { border-bottom: none; }
    .site-nav .site-row .row-label {
      flex: 0 0 auto;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      padding-top: 3px;
      white-space: nowrap;
    }
    .site-nav .site-row .row-links {
      flex: 1 1 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 0;
      min-width: 0;
    }
    .site-nav .site-link {
      width: 25%;
      padding: 3px 6px;
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 6px;
      transition: color .15s, background .15s;
    }
    .site-nav .site-link:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }
    /* 分类行展开 / 收起按钮 */
    .site-nav .row-toggle {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      margin-top: 1px;
      padding: 0;
      color: var(--sub);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color .15s;
    }
    .site-nav .row-toggle:hover { color: var(--accent); }
    .site-nav .row-toggle .arrow {
      display: inline-block;
      font-size: 16px;
      line-height: 1;
      transition: transform .2s ease;
    }
    .site-nav .row-toggle.expanded .arrow { transform: rotate(180deg); }
    .site-nav .nav-empty {
      text-align: center;
      color: var(--sub);
      font-size: 13px;
      padding: 24px 0;
    }

    /* ===== 分组区域 ===== */
    .group { max-width: 1100px; margin: 40px auto 0; }
    .group-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 0.6;
      margin-bottom: 16px;
      padding-left: 12px;
      border-left: 4px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;            /* 可点击展开/收缩 */
      user-select: none;
    }
    .group-title .arrow {
      display: inline-block;
      margin-left: auto;          /* 推到标题最右侧 */
      font-size: 36px;            /* 三角形再放大一倍 */
      color: var(--accent);
      transition: transform .2s ease;
    }
    .group.collapsed .arrow { transform: rotate(-90deg); }  /* 收缩时箭头朝右 */
    .group.collapsed .grid { display: none; }                /* 收缩时隐藏卡片 */
    .group-title span.badge {
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 2px 10px;
    }
    /* ===== 卡片网格 ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      /* 防止 grid 子项内容撑开导致整行溢出容器 */
      overflow: hidden;
    }
    .card {
      /* 关键：防止 grid 子项因内容过长将列宽撑开超出父容器 */
      min-width: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 22px rgba(74, 144, 226, 0.16);
    }
    .card .name {
      font-size: 16px;
      font-weight: 600;
    }
    .card .features {
      font-size: 11px;
      color: var(--sub);
      line-height: 1.5;
      /* 按分隔符合理断行：优先在 / 、 → 等标点处换行，避免把短语拆散导致换行难看 */
      word-break: normal;
      overflow-wrap: anywhere;
      line-break: strict;
      /* 固定显示两行，超出以省略号截断，保证卡片高度一致 */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty {
      text-align: center;
      color: var(--sub);
      padding: 60px 0;
      font-size: 15px;
    }
    footer {
      text-align: center;
      color: var(--sub);
      font-size: 12px;
      margin-top: 56px;
    }

    /* ===== 移动端适配（窄屏 <=600px） ===== */
    @media (max-width: 600px) {
      body { padding: 0 8px 36px; }
      header { padding: 8px 0 8px; }
      .site-nav { margin-top: 2px; padding: 12px 8px 14px; }
      .site-nav .cat-tabs { gap: 8px; }
      .site-nav .cat-tabs .cat-list { gap: 14px; }
      .site-nav .cat-tab { font-size: 14px; }
      .site-nav .site-row { gap: 10px; }
      .site-nav .site-row .row-label { font-size: 13px; }
      .site-nav .site-link { width: 33.333%; font-size: 13px; padding: 3px 2px; }
      .group { margin-top: 8px; }
      .group-title { font-size: 16px; }
      /* 所有手机固定三列，避免自动换行导致一行一/两个 */
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .card { padding: 14px 12px; }
      .card .name { font-size: 15px; }
      .card .features { font-size: 10px; }
    }

    /* ===== 超小屏（<=360px）仍保持三列，仅进一步压缩内边距与字号 ===== */
    @media (max-width: 360px) {
      .grid { gap: 8px; }
      .card { padding: 10px 8px; }
      .card .name { font-size: 14px; }
      .card .features { font-size: 9px; }
    }

    /* ===== 触屏设备：点击态更明显，去掉悬停位移避免误触 ===== */
    @media (hover: none) {
      .card:hover { transform: none; box-shadow: var(--shadow); }
      .card:active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
    }
  </style>

  <!-- 多语言（中文 / English）：参考 txt.html，按系统语言自动切换，原生侧也可注入 window.OKMORE_LANG 覆盖 -->
  <script>
    function okmoreGetLang(){
      var l = (window.OKMORE_LANG || navigator.language || 'zh-CN').toLowerCase();
      return l.indexOf('zh') === 0 ? 'zh' : 'en';
    }
    var OKMORE_I18N = {
      zh: {
        title: '网址导航',
        empty: '没有找到匹配的网站',
        navEmpty: '暂无匹配的网站'
      },
      en: {
        title: 'Web Navigation',
        empty: 'No matching sites found',
        navEmpty: 'No matching sites'
      }
    };
    function T(k){
      var d = OKMORE_I18N[okmoreGetLang()];
      return (d && d[k] != null) ? d[k] : (OKMORE_I18N.zh[k] != null ? OKMORE_I18N.zh[k] : k);
    }
    function okmoreApplyI18n(){
      var n = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < n.length; i++){
        var key = n[i].getAttribute('data-i18n');
        if (key) n[i].textContent = T(key);
      }
    }
    document.addEventListener('DOMContentLoaded', okmoreApplyI18n);
  </script>

  /* ===== 工具函数 ===== */
  const content = document.getElementById('content');
  const catTabs = document.getElementById('catTabs');
  const catPanel = document.getElementById('catPanel');
  // 当前语言：参考 txt.html，按系统语言自动检测（无需手动切换按钮）
  const lang = okmoreGetLang();

  // 以下静态/动态文案统一通过 head 中的 OKMORE_I18N + T() 按系统语言渲染（参考 txt.html）

  /* ===== 站点导航渲染与交互 ===== */
  // 导航内容随语言自动切换：中文显示国内导航，英文显示国外导航
  const navRegion = lang === 'en' ? 'en' : 'cn';
  let navCatIndex = 0;                           // 当前一级分类索引
  const navExpanded = { cn: {}, en: {} };        // 各二级分类行的展开状态

  // 分类标签行：各一级分类
  function renderCatTabs(cats, keyword) {
    catTabs.innerHTML = '';
    if (keyword) return;   // 搜索状态不显示分类标签
    const list = document.createElement('div');
    list.className = 'cat-list';
    cats.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cat-tab' + (i === navCatIndex ? ' active' : '');
      btn.textContent = c.cat;
      btn.addEventListener('click', () => {
        navCatIndex = i;
        renderSiteNav();
        // 选中标签滚动到可视区域
        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      });
      list.appendChild(btn);
    });
    catTabs.appendChild(list);
  }

  // 生成单个二级分类行（左侧二级分类名 + 右侧网站名 + 可选展开按钮）
  // key 用于记录展开状态；expandedMap 为展开状态表
  function buildRow(sub, expandedMap) {
    const expanded = !!expandedMap[sub.key];
    // 收起时：桌面每行 4 个、手机每行 3 个，保证正好一行
    const perRow = window.innerWidth <= 600 ? 3 : 4;
    const visibleCount = expanded ? sub.sites.length : perRow;
    const sites = sub.sites.slice(0, visibleCount);

    const row = document.createElement('div');
    row.className = 'site-row';

    const label = document.createElement('div');
    label.className = 'row-label';
    label.textContent = sub.cat;
    row.appendChild(label);

    const links = document.createElement('div');
    links.className = 'row-links';
    sites.forEach(s => {
      const a = document.createElement('a');
      a.className = 'site-link';
      a.href = s.link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.title = s.name;
      a.textContent = s.name;
      links.appendChild(a);
    });
    row.appendChild(links);

    // 展开 / 收起按钮（仅当该二级分类网站超过一行时显示）
    if (sub.sites.length > perRow) {
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'row-toggle' + (expanded ? ' expanded' : '');
      toggle.setAttribute('aria-expanded', String(expanded));
      toggle.setAttribute('aria-label', sub.cat);
      toggle.innerHTML = '<span class="arrow">▾</span>';
      toggle.addEventListener('click', () => {
        expandedMap[sub.key] = !expandedMap[sub.key];
        renderSiteNav();
      });
      row.appendChild(toggle);
    }
    return row;
  }

  // 将一级分类数组拍平成二级分类列表（key = 一级/二级，保证唯一）
  function flattenSubs(cats) {
    const out = [];
    cats.forEach(c => {
      (c.subs || []).forEach(s => {
        out.push({ key: c.cat + '/' + s.cat, cat: s.cat, sites: s.sites });
      });
    });
    return out;
  }

  // 渲染二级分类行集合；无数据时显示空提示
  function renderRows(subs, expandedMap) {
    catPanel.innerHTML = '';
    if (!subs.length) {
      const empty = document.createElement('div');
      empty.className = 'nav-empty';
      empty.textContent = T('navEmpty');
      catPanel.appendChild(empty);
      return;
    }
    subs.forEach(sub => catPanel.appendChild(buildRow(sub, expandedMap)));
  }

  // 渲染站点导航：单分类视图（各二级分类各一行，可展开）+ 搜索过滤
  function renderSiteNav(kw = '') {
    const keyword = kw.trim().toLowerCase();
    const cats = SITE_NAV[navRegion] || [];
    renderCatTabs(cats, keyword);
    const expandedMap = navExpanded[navRegion];

    // 搜索状态：跨全部二级分类收集匹配网站（保留二级分类名）
    if (keyword) {
      const subs = [];
      flattenSubs(cats).forEach(sub => {
        const sites = sub.sites.filter(s =>
          s.name.toLowerCase().includes(keyword) ||
          s.link.toLowerCase().includes(keyword));
        if (sites.length) subs.push({ key: sub.key, cat: sub.cat, sites });
      });
      renderRows(subs, expandedMap);
      return;
    }

    // 单分类视图：仅展示所选一级分类下的二级分类
    const parent = cats[navCatIndex];
    const subs = parent ? (parent.subs || []).map(s => ({
      key: parent.cat + '/' + s.cat, cat: s.cat, sites: s.sites
    })) : [];
    renderRows(subs, expandedMap);
  }

  // 渲染分组与卡片
  function render() {
    content.innerHTML = '';
    let hasAny = false;

    NAV_DATA.forEach(group => {
      const items = group.webList;
      if (items.length === 0) return;

      hasAny = true;

      const groupEl = document.createElement('section');
      groupEl.className = 'group';

      const title = document.createElement('div');
      title.className = 'group-title';
      title.setAttribute('role', 'button');
      title.setAttribute('aria-expanded', 'true');
      // 根据当前语言选择分组名（中文 groupName / 英文 groupNameEn）
      const groupLabel = lang === 'en' ? (group.groupNameEn || group.groupName) : group.groupName;
      title.innerHTML = `<span>${escapeHtml(groupLabel)}</span>` +
        `<span class="badge">${items.length}</span>` +
        `<span class="arrow">▾</span>`;
      // 点击标题：展开/收缩该分组
      title.addEventListener('click', () => {
        const collapsed = groupEl.classList.toggle('collapsed');
        title.setAttribute('aria-expanded', String(!collapsed));
      });
      groupEl.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'grid';

      items.forEach(item => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = item.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        // 根据当前语言选择名称与功能描述（中文 name/features / 英文 nameEn/featuresEn）
        const nameLabel = lang === 'en' ? (item.nameEn || item.name) : item.name;
        const featLabel = lang === 'en' ? (item.featuresEn || item.features) : item.features;
        a.innerHTML =
          `<div class="name">${escapeHtml(nameLabel)}</div>` +
          `<div class="features">${formatFeatures(featLabel)}</div>`;
        grid.appendChild(a);
      });

      groupEl.appendChild(grid);
      content.appendChild(groupEl);
    });

    if (!hasAny) {
      content.innerHTML = `<div class="empty">${T('empty')}</div>`;
    }
  }

  // 防止 HTML 注入
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 功能描述排版：在分隔符（/ 、 → ↔ + ，等）处插入零宽断行机会，
  // 让文本优先在分隔符处换行，避免把词/短语从中间拆断，换行更整齐好看。
  function formatFeatures(str) {
    var s = escapeHtml(str);
    // 分隔符后追加 <wbr>，作为可断行点（不显示任何字符）
    s = s.replace(/([\/、，,；;·|+→↔＆])\s*/g, '$1<wbr>');
    // 空格处同样允许断行
    s = s.replace(/\s+/g, '<wbr> ');
    return s;
  }

  /* ===== 事件绑定 ===== */
  okmoreApplyI18n();   // 按系统语言初始化标题等文案（参考 txt.html）
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  renderSiteNav();
  render();
</script>
</body>
