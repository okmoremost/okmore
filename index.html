<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title">实用网址导航</title>
  <style>
    /* ===== 全局基础样式 ===== */
    :root {
      --bg: #f5f6fa;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --sub: #7f8c9a;
      --accent: #4a90e2;
      --accent-soft: #eaf2fd;
      --border: #e8ebf0;
      --shadow: 0 2px 12px rgba(30, 50, 90, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 0 16px 48px;
      overflow-x: hidden;      /* 兜底：防止任何轻微横向溢出时可滑动 */
    }
    /* ===== 顶部标题与搜索 ===== */
    header {
      text-align: center;
      padding: 48px 0 28px;
    }
    header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    header p {
      color: var(--sub);
      margin-top: 8px;
      font-size: 14px;
    }
    .search-box {
      max-width: 560px;
      margin: 24px auto 0;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(74, 144, 226, 0.18);
    }
    .count-tip {
      text-align: center;
      color: var(--sub);
      font-size: 13px;
      margin: 12px 0 0;
    }
    /* ===== 分组区域 ===== */
    .group { max-width: 1100px; margin: 40px auto 0; }
    .group-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      padding-left: 12px;
      border-left: 4px solid var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;            /* 可点击展开/收缩 */
      user-select: none;
    }
    .group-title .arrow {
      display: inline-block;
      margin-left: auto;          /* 推到标题最右侧 */
      font-size: 36px;            /* 三角形再放大一倍 */
      color: var(--accent);
      transition: transform .2s ease;
    }
    .group.collapsed .arrow { transform: rotate(-90deg); }  /* 收缩时箭头朝右 */
    .group.collapsed .grid { display: none; }                /* 收缩时隐藏卡片 */
    .group-title span.badge {
      font-size: 12px;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 2px 10px;
    }
    /* ===== 卡片网格 ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      /* 防止 grid 子项内容撑开导致整行溢出容器 */
      overflow: hidden;
    }
    .card {
      /* 关键：防止 grid 子项因内容过长将列宽撑开超出父容器 */
      min-width: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 22px rgba(74, 144, 226, 0.16);
    }
    .card .name {
      font-size: 16px;
      font-weight: 600;
    }
    .card .features {
      font-size: 11px;
      color: var(--sub);
      line-height: 1.5;
      /* 固定显示两行，超出以省略号截断，保证卡片高度一致 */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty {
      text-align: center;
      color: var(--sub);
      padding: 60px 0;
      font-size: 15px;
    }
    footer {
      text-align: center;
      color: var(--sub);
      font-size: 12px;
      margin-top: 56px;
    }

    /* ===== 移动端适配（窄屏 <=600px） ===== */
    @media (max-width: 600px) {
      body { padding: 0 12px 36px; }
      header { padding: 28px 0 18px; }
      header h1 { font-size: 22px; }
      header p { font-size: 13px; }
      .search-box { margin-top: 16px; }
      .search-box input { padding: 12px 16px; font-size: 14px; }
      .group { margin-top: 0; }
      .group-title { font-size: 16px; }
      /* 所有手机固定三列，避免自动换行导致一行一/两个 */
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .card { padding: 14px 12px; }
      .card .name { font-size: 15px; }
      .card .features { font-size: 10px; }
    }

    /* ===== 超小屏（<=360px）仍保持三列，仅进一步压缩内边距与字号 ===== */
    @media (max-width: 360px) {
      .grid { gap: 8px; }
      .card { padding: 10px 8px; }
      .card .name { font-size: 14px; }
      .card .features { font-size: 9px; }
    }

    /* ===== 触屏设备：点击态更明显，去掉悬停位移避免误触 ===== */
    @media (hover: none) {
      .card:hover { transform: none; box-shadow: var(--shadow); }
      .card:active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
    }
  </style>

  <!-- 多语言（中文 / English）：参考 txt.html，按系统语言自动切换，原生侧也可注入 window.OKMORE_LANG 覆盖 -->
  <script>
    function okmoreGetLang(){
      var l = (window.OKMORE_LANG || navigator.language || 'zh-CN').toLowerCase();
      return l.indexOf('zh') === 0 ? 'zh' : 'en';
    }
    var OKMORE_I18N = {
      zh: {
        title: '实用网址导航',
        searchPlaceholder: '搜索名称或功能，如：PDF/OCR/背景替换/证件',
        found: function(n){ return '找到 ' + n + ' 个相关网站'; },
        notFound: '没有找到匹配的网站，换个关键词试试～',
        empty: '没有找到匹配的网站',
        footerPrefix: '共收录',
        footerSuffix: '个实用网站'
      },
      en: {
        title: 'Useful Web Navigation',
        searchPlaceholder: 'Search name or feature, e.g. PDF/OCR/BgReplace/ID',
        found: function(n){ return 'Found ' + n + ' related sites'; },
        notFound: 'No matching sites found, try another keyword~',
        empty: 'No matching sites found',
        footerPrefix: 'Collected',
        footerSuffix: 'useful sites'
      }
    };
    function T(k){
      var d = OKMORE_I18N[okmoreGetLang()];
      return (d && d[k] != null) ? d[k] : (OKMORE_I18N.zh[k] != null ? OKMORE_I18N.zh[k] : k);
    }
    function okmoreApplyI18n(){
      var n = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < n.length; i++){
        var key = n[i].getAttribute('data-i18n');
        if (key) n[i].textContent = T(key);
      }
    }
    document.addEventListener('DOMContentLoaded', okmoreApplyI18n);
  </script>

      const items = group.webList.filter(item => {
        if (!kw) return true;
        const hay = (item.name + ' ' + item.features + ' ' + item.link).toLowerCase();
        return hay.includes(kw);
      });
      if (items.length === 0) return;

      hasAny = true;
      matchedTotal += items.length;

      const groupEl = document.createElement('section');
      groupEl.className = 'group';

      const title = document.createElement('div');
      title.className = 'group-title';
      title.setAttribute('role', 'button');
      title.setAttribute('aria-expanded', 'true');
      // 根据当前语言选择分组名（中文 groupName / 英文 groupNameEn）
      const groupLabel = lang === 'en' ? (group.groupNameEn || group.groupName) : group.groupName;
      title.innerHTML = `<span>${escapeHtml(groupLabel)}</span>` +
        `<span class="badge">${items.length}</span>` +
        `<span class="arrow">▾</span>`;
      // 点击标题：展开/收缩该分组
      title.addEventListener('click', () => {
        const collapsed = groupEl.classList.toggle('collapsed');
        title.setAttribute('aria-expanded', String(!collapsed));
      });
      groupEl.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'grid';

      items.forEach(item => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = item.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML =
          `<div class="name">${escapeHtml(item.name)}</div>` +
          `<div class="features">${escapeHtml(item.features)}</div>`;
        grid.appendChild(a);
      });

      groupEl.appendChild(grid);
      content.appendChild(groupEl);
    });

    // 搜索结果提示（随系统语言自动切换）
    if (kw) {
      countTip.textContent = matchedTotal > 0
        ? T('found')(matchedTotal)
        : T('notFound');
    } else {
      countTip.textContent = '';
    }

    if (!hasAny) {
      content.innerHTML = `<div class="empty">${T('empty')}</div>`;
    }
  }

  // 防止 HTML 注入
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ===== 事件绑定 ===== */
  searchInput.addEventListener('input', e => render(e.target.value));
  okmoreApplyI18n();   // 按系统语言初始化标题、h1、页脚文案（参考 txt.html）
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  calcTotal();
  render();
</script>
</body>
</html>
