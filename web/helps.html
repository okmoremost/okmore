<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">OK以上浏览器 - 使用帮助手册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.7;
        }

        /* 顶部标题栏 */
        header {
            background-color: #2563eb;
            color: #fff;
            padding: 1.2rem 5%;
            text-align: center;
        }

        header h1 {
            font-size: 1.6rem;
            margin-bottom: 0.3rem;
        }

        header p {
            opacity: 0.92;
            font-size: 0.9rem;
        }

        /* 主体布局：左侧列表 + 右侧内容 */
        .layout {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            min-height: calc(100vh - 220px);
        }

        /* 左侧列表（PC 端固定侧栏） */
        .sidebar {
            width: 180px;
            flex-shrink: 0;
            background: #fff;
            border-radius: 0 0 14px 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            padding: 1rem 0;
            margin: 1.5rem 1rem 2rem 5%;
            align-self: flex-start;
            position: sticky;
            top: 1.5rem;
        }

        /* 一级导航项 */
        .sidebar .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.4rem;
            color: #444;
            text-decoration: none;
            font-size: 1rem;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .sidebar .nav-item:hover {
            background-color: #eff4ff;
            color: #2563eb;
        }

        .sidebar .nav-item.active {
            background-color: #eff4ff;
            color: #2563eb;
            border-left-color: #2563eb;
            font-weight: 600;
        }

        /* 含子项的父级标题加粗 */
        .sidebar .nav-parent {
            font-weight: 600;
        }

        /* 折叠箭头 */
        .sidebar .nav-toggle {
            font-size: 0.75rem;
            transition: transform 0.2s ease;
            opacity: 0.6;
        }

        .sidebar .nav-parent.open .nav-toggle {
            transform: rotate(90deg);
        }

        /* 二级子目录容器 */
        .sidebar .nav-children {
            display: none;
            background-color: #fafbff;
        }

        .sidebar .nav-children.open {
            display: block;
        }

        .sidebar .nav-child {
            padding: 0.7rem 1.4rem 0.7rem 2.6rem;
            font-size: 0.95rem;
            font-weight: 400;
            border-left-color: transparent;
        }

        /* 多级嵌套的递进缩进（折叠态由 .layout.collapsed 规则覆盖为 0） */
        .sidebar .nav-depth-1 { padding-left: 2.6rem; }
        .sidebar .nav-depth-2 { padding-left: 3.8rem; }

        /* 侧栏展开/收起按钮 */
        .sidebar-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 0 0 0.5rem;
            padding: 0.55rem;
            border: none;
            border-radius: 10px;
            background: #eff4ff;
            color: #2563eb;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .sidebar-toggle:hover { background: #dbe7ff; }

        /* 折叠态：侧栏收窄为缩略条，仅显示每项首字 */
        .sidebar .nav-label { display: inline; }
        .sidebar .nav-mono { display: none; }
        .layout.collapsed .sidebar { width: 42px; min-width: 42px; }
        .layout.collapsed .sidebar .nav-label { display: none; }
        .layout.collapsed .sidebar .nav-mono { display: inline; }
        .layout.collapsed .sidebar .nav-item {
            justify-content: center;
            padding-left: 0;
            padding-right: 0;
        }
        .layout.collapsed .sidebar .nav-child { padding-left: 0; }
        .layout.collapsed .sidebar .nav-toggle { display: none; }
        .layout.collapsed .sidebar-toggle { font-size: 1.1rem; }

        /* 右侧内容区 */
        .content {
            flex: 1;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            padding: 2.4rem 2.6rem;
            margin: 1.5rem 5% 2rem 0;
        }

        .content section {
            display: none;
        }

        .content section.active {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content h2 {
            color: #222;
            font-size: 1.5rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px solid #eff4ff;
        }

        .content p {
            color: #555;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .content a {
            color: #2563eb;
            text-decoration: none;
        }

        .content a:hover {
            text-decoration: underline;
        }

        .content code {
            background-color: #f1f5f9;
            padding: 0.15rem 0.45rem;
            border-radius: 5px;
            font-family: Consolas, "Microsoft Yahei", monospace;
            font-size: 0.92rem;
            color: #e11d48;
        }

        /* 帮助页截图：竖向排列、自适应宽度 */
        .help-imgs {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 1.2rem;
        }

        .help-imgs img {
            max-width: 50%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            border: 1px solid #eee;
            background: #fff;
        }

        /* 第一张图下方的红色说明文字（用 .content 前缀提高优先级，覆盖 .content p 的 #555） */
        .content .help-note {
            color: #e11d48;
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0.2rem 0;
            /* 长 URL（如 Koofr 密码链接）在窄屏能正常换行，不溢出内容区 */
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* 红色说明内的链接保持红色，避免与红字不协调 */
        .content .help-note a {
            color: #e11d48;
            text-decoration: underline;
            /* 链接内的 URL 也允许在任意字符间断行 */
            overflow-wrap: anywhere;
            word-break: break-all;
        }

        /* 移动端：左侧列表变为顶部横向可滚动标签，内容在下方 */
        @media (max-width: 768px) {
            /* 手机端仍保持左右两栏：窄侧栏 + 自适应内容，不改上下排布 */
            .layout {
                flex-direction: row;
                min-height: auto;
            }

            .sidebar {
                width: 34%;
                max-width: 180px;
                min-width: 104px;
                margin: 1rem 0.5rem 1rem 4%;
                position: static;
                align-self: stretch;
                padding: 0.6rem 0;
                border-radius: 14px;
            }

            .sidebar .nav-item {
                padding: 0.7rem 0.8rem;
                font-size: 0.92rem;
                border-left: none;
            }

            .sidebar .nav-child {
                padding: 0.6rem 0.8rem 0.6rem 1.7rem;
                font-size: 0.88rem;
            }

            .content {
                margin: 1rem 4% 1rem 0;
                padding: 1.4rem 1.2rem;
            }

            .content h2 {
                font-size: 1.3rem;
            }

            /* 手机端截图恢复满宽，避免半宽过小看不清 */
            .help-imgs img {
                max-width: 100%;
            }

            /* 手机端收缩态宽度再减半（PC 为 30px，这里取 15px），并覆盖展开态的 min-width 使其真正收窄 */
            .layout.collapsed .sidebar { width: 32px; min-width: 32px; }
        }
    </style>
</head>
<body>
    <header>
        <h1 data-i18n="headerTitle">使用帮助手册</h1>
        <p data-i18n="headerDesc">OK以上浏览器 · 常见问题与使用指南</p>
    </header>

    <div class="layout" id="layout">
        <!-- 左侧列表：支持二级子目录。新增条目时在 OKMORE_HELP_NAV 追加；
            含 children 的项为可折叠父级，叶节点点击切换右侧 section（id 对应 sec-xxx） -->
        <nav class="sidebar" id="sidebar">
            <button type="button" id="sidebarToggle" class="sidebar-toggle" aria-label="展开/收起侧栏">« 收起</button>
        </nav>

        <!-- 右侧内容区：由脚本根据 OKMORE_HELP_NAV + OKMORE_HELP_CONTENT 循环生成（富文本 Markdown） -->
        <main class="content" id="content"></main>
    </div>

    <!-- 多语言：按系统语言自动切换，原生侧也可注入 window.OKMORE_LANG 覆盖 -->
    <script>
    // 左侧列表数据源：支持二级 children。新增条目只需在此数组追加，并加一个对应 id 的 section。
    // i18nKey 存在时，标签走 [data-i18n] 由 okmoreApplyI18n 统一切换；品牌名（坚果云/Koofr/Gitee/Github）无 i18nKey，保持原样。
    var OKMORE_HELP_NAV = [
        { id: 'home', label: '使用帮助手册', i18nKey: 'navHome', titleKey: 'homeTitle' },
        { id: 'bookmarksync', label: '书签同步', i18nKey: 'navBookmarksync', titleKey: 'bookmarksyncTitle', children: [
            { id: 'webdav', label: 'WebDav', i18nKey: 'navWebdav', titleKey: 'webdavTitle', children: [
                { id: 'webdav-jianguoyun', label: '坚果云', titleKey: 'webdavJyTitle' },
                { id: 'webdav-koofr',      label: 'Koofr', titleKey: 'webdavKoofrTitle' },
                { id: 'webdav-other',      label: '其它', i18nKey: 'navWebdavOther', titleKey: 'webdavOtherTitle' }
            ]},
            { id: 'git', label: 'Git', i18nKey: 'navGit', titleKey: 'gitTitle', children: [
                { id: 'git-gitee',  label: 'Gitee', titleKey: 'gitGiteeTitle' },
                { id: 'git-github', label: 'Github', titleKey: 'gitGithubTitle' }
            ]},
            { id: 'nextcloud', label: 'Nextcloud', i18nKey: 'navNextcloud', titleKey: 'nextcloudTitle' }
        ]}
    ];

    function okmoreGetLang(){
        var l = (window.OKMORE_LANG || navigator.language || 'zh-CN').toLowerCase();
        return l.indexOf('zh') === 0 ? 'zh' : 'en';
    }

    var OKMORE_I18N = {
        zh: {
            title: 'OK以上浏览器 - 使用帮助手册',
            headerTitle: '使用帮助手册',
            headerDesc: 'OK以上浏览器 · 常见问题与使用指南',
            navHome: '使用帮助手册',
            navBookmarksync: '书签同步',
            navWebdav: 'WebDav',
            navWebdavOther: '其它',
            navGit: 'Git',
            navNextcloud: 'Nextcloud',
            homeTitle: '使用帮助手册',
            bookmarksyncTitle: '书签同步',
            nextcloudTitle: 'Nextcloud',
            webdavTitle: 'WebDav',
            webdavJyTitle: '坚果云',
            webdavKoofrTitle: 'Koofr',
            webdavOtherTitle: '其它',
            gitTitle: 'Git',
            gitGiteeTitle: 'Gitee',
            gitGithubTitle: 'Github'
        },
        en: {
            title: 'OkMore Browser - Help Manual',
            headerTitle: 'Help Manual',
            headerDesc: 'OkMore Browser · FAQ & Usage Guide',
            navHome: 'Help Manual',
            navBookmarksync: 'Bookmark Sync',
            navWebdav: 'WebDav',
            navWebdavOther: 'Other',
            navGit: 'Git',
            navNextcloud: 'Nextcloud',
            homeTitle: 'Help Manual',
            bookmarksyncTitle: 'Bookmark Sync',
            nextcloudTitle: 'Nextcloud',
            webdavTitle: 'WebDav',
            webdavJyTitle: 'jianguoyun',
            webdavKoofrTitle: 'Koofr',
            webdavOtherTitle: 'Other',
            gitTitle: 'Git',
            gitGiteeTitle: 'Gitee',
            gitGithubTitle: 'Github'
        }
    };

    // 右侧内容：以 Markdown 编写（富文本），按导航项 id 取值，由脚本渲染。
    var OKMORE_HELP_CONTENT = {
        zh: {
            'home': '电脑端书签同步推荐使用开源项目 [floccus](https://github.com/floccusaddon/floccus)，支持 Chrome / Edge / Firefox。',
            'bookmarksync': '书签同步支持 WebDav/Git/Nextcloud 三种方式，可将书签、设置等数据备份到网盘或代码仓库。\n\n电脑端书签同步推荐开源项目 [floccus](https://github.com/floccusaddon/floccus)',
            'nextcloud': '待更新。',
            'webdav': '通过 WebDav 可将书签、设置等数据同步到自建或第三方网盘。\n\n支持加密，自建云盘、自建NAS、坚果云、中国科技云、Koofr、pCloud、IceDrive、kDrive、MagentaCLOUD、Disroot、Mailbox.org、Synology NAS、GMX、WEB.DE，仅会员/付费解锁：阿里云盘、天翼云盘、123云盘等',
            'webdav-jianguoyun': '![坚果云](help:jianguoyun|png)\n> 密码来源于设置的第三方应用授权的密码\n> 电脑操作如下图：\n![电脑操作 1](help:jianguoyun_pc_1|png)\n![电脑操作 2](help:jianguoyun_pc_2|png)',
            'webdav-koofr': 'Koofr WebDav 配置说明。\n\n> 密码来源于 [https://app.koofr.net/app/admin/preferences/password](https://app.koofr.net/app/admin/preferences/password) 最下面的生成新密码',
            'webdav-other': '大概步骤同坚果云、Koofr，待更新。',
            'git': '通过 Git 仓库（如 GitHub / Gitee）以版本化方式备份与同步数据。\n\nGit 仓库同步，如Gitee、Github、GitLab、Gitea等，不支持加密',
            'git-gitee': '先创建仓库，Gitee 配置如下图：\n\n![Gitee](help:gitee|jpg)\n> 密码来源于设置——私人令牌',
            'git-github': '先创建仓库，Github 配置如下图：\n\n![Github](help:github|jpg)\n> 密码来源于 Settings——Developer Settings——Personal access tokens'
        },
        en: {
            'home': 'For desktop bookmarks sync, we recommend the open-source project [floccus](https://github.com/floccusaddon/floccus), which supports Chrome / Edge / Firefox.',
            'bookmarksync': 'Bookmark Sync supports WebDav/Git/Nextcloud. You can back up bookmarks and settings to a cloud drive or a code repository.\n\nFor desktop bookmarks sync, the open-source project [floccus](https://github.com/floccusaddon/floccus)',
            'nextcloud': 'To be updated.',
            'webdav': 'Sync bookmarks and settings to your own or third-party WebDav storage.\n\nSupports encryption, self-hosted cloud, NAS, Nutstore, Koofr, pCloud, IceDrive, kDrive, MagentaCLOUD, Disroot, Mailbox.org, Synology NAS, GMX, WEB.DE, etc.',
            'webdav-jianguoyun': '![jianguoyun](help:jianguoyun|png)\n> The password is the one you set for third-party app authorization\n> PC operations are shown below:\n![PC operation 1](help:jianguoyun_pc_1|png)\n![PC operation 2](help:jianguoyun_pc_2|png)',
            'webdav-koofr': 'Koofr WebDav configuration guide.\n\n> The password comes from [https://app.koofr.net/app/admin/preferences/password](https://app.koofr.net/app/admin/preferences/password) — the "Generate new password" at the bottom',
            'webdav-other': 'Roughly the same steps as jianguoyun and Koofr. To be updated.',
            'git': 'Back up and sync your data in a versioned way via a Git repository (e.g. GitHub / Gitee).\n\nGit repository sync, such as Gitee, GitHub, GitLab, Gitea, etc., does not support encryption.',
            'git-gitee': 'Create a repository first, Gitee configuration is shown below:\n\n![Gitee](help:gitee|jpg)\n> The password comes from Settings — Private Token',
            'git-github': 'Create a repository first, Github configuration is shown below:\n\n![Github](help:github|jpg)\n> The password comes from Settings — Developer Settings — Personal access tokens'
        }
    };

    // 按当前语言取某导航项 id 对应的 Markdown 内容
    function getHelpContent(id){
        var lang = okmoreGetLang();
        var d = OKMORE_HELP_CONTENT[lang] || OKMORE_HELP_CONTENT.zh;
        return (d && d[id] != null) ? d[id] : '';
    }

    // HTML 转义，防止 Markdown 文本中的特殊字符破坏结构
    function escapeHtml(str){
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // 行内富文本：代码、加粗、斜体、链接（默认新窗口打开）
    function inlineMd(s){
        s = escapeHtml(s);
        s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m, t, u){
            var parts = u.split('|');
            var href = parts[0];
            var target = parts[1] || '_blank';
            return '<a href="' + href + '" target="' + target + '" rel="noopener">' + t + '</a>';
        });
        return s;
    }

    // 极简 Markdown → HTML（段落 / 标题 / 列表 / 引用=红色说明 / 帮助截图）
    // 帮助截图语法：![alt](help:名称|扩展名) → <img data-help-img data-ext>，由 applyHelpImages 注入实际路径
    function mdToHtml(md){
        var lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
        var html = '';
        var para = [], ul = [], ol = [], note = [], imgs = [];

        function flushPara(){ if (para.length){ html += '<p>' + inlineMd(para.join(' ')) + '</p>'; para = []; } }
        function flushList(){
            if (ul.length){ html += '<ul>' + ul.map(function(x){ return '<li>' + inlineMd(x) + '</li>'; }).join('') + '</ul>'; ul = []; }
            if (ol.length){ html += '<ol>' + ol.map(function(x){ return '<li>' + inlineMd(x) + '</li>'; }).join('') + '</ol>'; ol = []; }
        }
        function flushNote(){ if (note.length){ html += '<div class="help-note">' + inlineMd(note.join(' ')) + '</div>'; note = []; } }
        function flushImgs(){ if (imgs.length){ html += '<div class="help-imgs">' + imgs.join('') + '</div>'; imgs = []; } }

        for (var i = 0; i < lines.length; i++){
            var line = lines[i];
            if (/^\s*$/.test(line)){ flushPara(); flushList(); flushNote(); flushImgs(); continue; }
            var h = line.match(/^(#{1,3})\s+(.*)$/);
            if (h){ flushPara(); flushList(); flushNote(); flushImgs(); var tag = h[1].length >= 3 ? 'h4' : 'h3'; html += '<' + tag + '>' + inlineMd(h[2]) + '</' + tag + '>'; continue; }
            var bq = line.match(/^>\s?(.*)$/);
            if (bq){ flushPara(); flushList(); flushImgs(); note.push(bq[1]); continue; }
            var img = line.match(/^!\[([^\]]*)\]\(help:([^|]+)\|([^)]+)\)$/);
            if (img){ flushPara(); flushList(); flushNote(); imgs.push('<img data-help-img="' + img[2].trim() + '" data-ext="' + img[3].trim() + '" alt="' + img[1] + '">'); continue; }
            var uli = line.match(/^[-*]\s+(.*)$/);
            if (uli){ flushPara(); flushNote(); flushImgs(); ul.push(uli[1]); continue; }
            var oli = line.match(/^\d+\.\s+(.*)$/);
            if (oli){ flushPara(); flushNote(); flushImgs(); ol.push(oli[1]); continue; }
            flushList(); flushNote(); flushImgs();
            para.push(line.trim());
        }
        flushPara(); flushList(); flushNote(); flushImgs();
        return html;
    }

    // 根据导航数据循环生成右侧所有 section（含书签同步的子目录/子子目录）
    function renderContent(){
        var content = document.getElementById('content');
        var items = [];
        (function collect(list){
            list.forEach(function(it){
                items.push(it);
                if (it.children) collect(it.children);
            });
        })(OKMORE_HELP_NAV);

        items.forEach(function(it){
            var sec = document.createElement('section');
            sec.id = 'sec-' + it.id;
            var h2 = document.createElement('h2');
            if (it.titleKey) h2.setAttribute('data-i18n', it.titleKey);
            h2.textContent = it.label;
            sec.appendChild(h2);
            var body = document.createElement('div');
            body.className = 'help-body';
            body.innerHTML = mdToHtml(getHelpContent(it.id));
            sec.appendChild(body);
            content.appendChild(sec);
        });

        var home = document.getElementById('sec-home');
        if (home) home.classList.add('active');
    }

    function T(k){
        var d = OKMORE_I18N[okmoreGetLang()];
        return (d && d[k] != null) ? d[k] : (OKMORE_I18N.zh[k] != null ? OKMORE_I18N.zh[k] : k);
    }

    // 渲染左侧列表（支持二级折叠）
    // 若节点带 i18nKey，则给标签元素打 data-i18n，由通用 okmoreApplyI18n() 统一切换中英文。
    // 每个节点包含 .nav-label（展开时显示）与 .nav-mono（折叠时显示首字缩略）。
    // 支持任意层级嵌套：含 children 的项生成「父级标题 + 子目录容器」，子项递归渲染。
    function renderNav(){
        var nav = document.getElementById('sidebar');

        // 构建「标签 + 首字缩略」两个 span 并追加到节点
        function buildLabel(node, text, i18nKey){
            var label = document.createElement('span');
            label.className = 'nav-label';
            if (i18nKey) label.setAttribute('data-i18n', i18nKey);
            label.textContent = text;

            var mono = document.createElement('span');
            mono.className = 'nav-mono';
            mono.textContent = text.charAt(0);

            node.appendChild(label);
            node.appendChild(mono);
        }

        // 递归渲染单个节点；container 为挂载容器（侧栏或父级子目录容器），depth 控制缩进层级
        function buildNode(item, container, depth){
            if (item.children && item.children.length){
                // 含子项的父级：可点击切换自身内容 + 折叠子目录
                var parent = document.createElement('div');
                parent.className = 'nav-item nav-parent' + (depth > 0 ? ' nav-child nav-depth-' + depth : '');
                buildLabel(parent, item.label, item.i18nKey);

                var toggle = document.createElement('span');
                toggle.className = 'nav-toggle';
                toggle.textContent = '▶';
                parent.appendChild(toggle);

                var childrenWrap = document.createElement('div');
                childrenWrap.className = 'nav-children';

                parent.addEventListener('click', function(){
                    var isOpen = childrenWrap.classList.toggle('open');
                    parent.classList.toggle('open', isOpen);
                    if (item.id) showSection(item.id, parent, childrenWrap);
                });

                item.children.forEach(function(child){
                    buildNode(child, childrenWrap, depth + 1);
                });

                container.appendChild(parent);
                container.appendChild(childrenWrap);
            } else {
                // 叶节点：点击切换右侧 section
                var a = document.createElement('a');
                a.className = 'nav-item nav-child' + (depth > 0 ? ' nav-depth-' + depth : '');
                buildLabel(a, item.label, item.i18nKey);
                a.setAttribute('data-target', 'sec-' + item.id);
                a.addEventListener('click', function(e){
                    e.stopPropagation();
                    showSection(item.id, null, container, a);
                });
                container.appendChild(a);
            }
        }

        OKMORE_HELP_NAV.forEach(function(item){
            buildNode(item, nav, 0);
        });
    }

    // 切换右侧内容并高亮当前项
    function showSection(id, activeEl, parentEl, childEl){
        // 重置所有高亮
        document.querySelectorAll('#sidebar .nav-item').forEach(function(el){
            el.classList.remove('active');
        });
        // 高亮当前项；若为子项被点击，则展开其所在父级的子目录（parentEl 即 childrenWrap）
        if (childEl){
            parentEl.classList.add('open');
            childEl.classList.add('active');
        } else if (activeEl){
            activeEl.classList.add('active');
        }
        // 切换内容显示
        document.querySelectorAll('#content section').forEach(function(sec){
            sec.classList.toggle('active', sec.id === 'sec-' + id);
        });
    }

    // 帮助页截图目录（web/helps.html 相对项目根：上一级 + images/helps/）
    var OKMORE_HELP_IMG_PREFIX = '../images/helps/';

    // 根据当前语言设置帮助页截图：英文优先用 同名_en 变体，缺失则回退到原图，避免破图。
    function applyHelpImages(){
        var lang = okmoreGetLang();
        var suffix = lang === 'en' ? '_en' : '';
        var imgs = document.querySelectorAll('[data-help-img]');
        for (var i = 0; i < imgs.length; i++){
            // 用 IIFE 按元素捕获，避免循环变量闭包错乱（所有 onerror 指向最后一次迭代）
            (function(img){
                var base = img.getAttribute('data-help-img');
                var ext = img.getAttribute('data-ext') || 'png';
                img.onerror = null; // 清除旧处理器，防止回退时死循环
                img.onerror = function(){
                    // _en 变体不存在时回退到默认图（仅回退一次）
                    this.onerror = null;
                    if (suffix) this.src = OKMORE_HELP_IMG_PREFIX + base + '.' + ext;
                };
                img.src = OKMORE_HELP_IMG_PREFIX + base + suffix + '.' + ext;
            })(imgs[i]);
        }
    }

    function okmoreApplyI18n(){
        document.documentElement.setAttribute('data-lang', okmoreGetLang());
        var n = document.querySelectorAll('[data-i18n]');
        for (var i = 0; i < n.length; i++){
            var key = n[i].getAttribute('data-i18n');
            // 使用 innerHTML 以支持翻译文本内联链接（如首页的 floccus 超链接）
            if (key) n[i].innerHTML = T(key);
        }
        // 语言切换时同步更新截图（中文原图 / 英文 _en 变体）
        applyHelpImages();
    }

    document.documentElement.setAttribute('data-lang', okmoreGetLang());
    document.addEventListener('DOMContentLoaded', function(){
        renderNav();
        renderContent();
        okmoreApplyI18n();
        // 默认高亮首页导航项
        var homeNav = document.querySelector('[data-target="sec-home"]');
        if (homeNav) homeNav.classList.add('active');

        // 侧栏展开/收起：展开为当前宽度，收起收窄为仅显示首字缩略
        var layoutEl = document.getElementById('layout');
        var toggleBtn = document.getElementById('sidebarToggle');
        toggleBtn.addEventListener('click', function(){
            var collapsed = layoutEl.classList.toggle('collapsed');
            toggleBtn.textContent = collapsed ? '»' : '« 收起';
        });
    });
    </script>
</body>
</html>
